name: Deploy to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  AZURE_NODE_VERSION: '~22'
  RESOURCE_GROUP_NAME: TypeScriptReposAutomation2
  FUNCTION_APP_NAME: TypeScriptReposAutomation2
  FUNCTION_APP_HOST_NAME: typescriptreposautomation-d0gkhdf5d7h4fce4.b02.azurefd.net
  STORAGE_ACCOUNT_NAME: typescriptreposauto997e
  STORAGE_CONTAINER_NAME: deployment
  FUNCTION_ZIP_NAME: function.zip

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Bundle
        run: npm run bundle

      - name: Smoke test
        run: node dist/functions/index.js

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-app
          path: |
            host.json
            package.json
            dist/functions/index.js

  deploy:
    runs-on:
      - "self-hosted"
      - "1ES.Pool=TypeScript-1ES-GitHub-Deploys"
      - "1ES.ImageOverride=azure-linux-3"
    needs: build
    environment:
      name: azure
    permissions:
      id-token: write

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-app

      - name: Create zip
        run: zip -r ${{ env.FUNCTION_ZIP_NAME }} .

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  
      - name: Upload blob
        run: az storage blob upload -f ${{ env.FUNCTION_ZIP_NAME }} --account-name ${{ env.STORAGE_ACCOUNT_NAME }} -c ${{ env.STORAGE_CONTAINER_NAME }} -n ${{ env.FUNCTION_ZIP_NAME }} --overwrite true --auth-mode login

      # - name: Set package path
      #   run: az functionapp config appsettings set -g ${{ env.RESOURCE_GROUP_NAME }} -n ${{ env.FUNCTION_APP_NAME }} --settings WEBSITE_RUN_FROM_PACKAGE="https://${{ env.STORAGE_ACCOUNT_NAME }}.blob.core.windows.net/${{ env.STORAGE_CONTAINER_NAME }}/${{ env.FUNCTION_ZIP_NAME }}"

      - name: Configure Node runtime
        run: az functionapp config appsettings set -g ${{ env.RESOURCE_GROUP_NAME }} -n ${{ env.FUNCTION_APP_NAME }} --settings WEBSITE_NODE_DEFAULT_VERSION="${{ env.AZURE_NODE_VERSION }}"

      - name: Restart app
        run: az functionapp restart -g ${{ env.RESOURCE_GROUP_NAME }} -n ${{ env.FUNCTION_APP_NAME }}

      - name: Verify app startup
        run: |
          for attempt in {1..12}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              https://${{ env.FUNCTION_APP_HOST_NAME }}/api/TypeScriptRepoPullRequestWebhook || true)
            if [[ "$status" == "500" ]]; then
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $status"
            sleep 10
          done
          exit 1
